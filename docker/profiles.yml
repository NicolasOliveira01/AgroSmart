# Perfil do dbt usado DENTRO do container.
# Não tem nenhuma senha escrita: lê as credenciais das variáveis de ambiente,
# que o docker-compose carrega do .env.
agrosmart:
  target: docker
  outputs:
    docker:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA') }}"
      threads: 4
